name: Verify published image
on:
  pull_request:
    branches: [main]
    paths: [scripts/ci/**, .github/workflows/verify-public-image.yml]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full source commit recorded on the existing image
        required: true
        type: string
      digest:
        description: Exact sha256 index digest from the publisher
        required: true
        type: string
      release_tag:
        description: Optional existing version tag to verify, never changed
        default: ''
        type: string
permissions:
  contents: read
jobs:
  anonymous-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify existing immutable image without rebuilding or logging in
        env:
          # Write-once public voice fixture; PR jobs never build on the worker.
          IMAGE: ghcr.io/humanitylabs-org/wizard-voice-service
          IMAGE_SHA: ${{ inputs.image_sha || 'a16698e0ac4654e8a5b2cab5af182d34c772b254' }}
          DIGEST: ${{ inputs.digest || 'sha256:11919223c206164ad96d3f7802352ebb2c6fb72d47949eeb0eae8a00ba9e6075' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python3 scripts/ci/ghcr_image.py verify
          --image "$IMAGE" --sha "$IMAGE_SHA"
          --digest "$DIGEST" --release "$RELEASE_TAG"

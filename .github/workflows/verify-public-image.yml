name: Verify published image
on:
  pull_request:
    branches: [main]
    paths: [scripts/ci/**, .github/workflows/verify-public-image.yml]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full source commit recorded on the existing image
        required: true
        type: string
      digest:
        description: Exact sha256 index digest from the publisher
        required: true
        type: string
      release_tag:
        description: Optional existing version tag to verify, never changed
        default: ''
        type: string
permissions:
  contents: read
jobs:
  anonymous-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify existing immutable image without rebuilding or logging in
        env:
          # Bootstrap PR smoke uses an existing public sibling image. Dispatch
          # verifies this repository's new image after its visibility gate opens.
          IMAGE: ${{ github.event_name == 'pull_request' && 'ghcr.io/humanitylabs-org/wizard-agent-service' || 'ghcr.io/humanitylabs-org/wizard-voice-service' }}
          IMAGE_SHA: ${{ inputs.image_sha || '3a1601b3a6fafe3c038c0326d222fe26c802c706' }}
          DIGEST: ${{ inputs.digest || 'sha256:484eaa0816395d03f48fe941bc32b1fdc210fccddbbb294fc36568bdcff54356' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python3 scripts/ci/ghcr_image.py verify
          --image "$IMAGE" --sha "$IMAGE_SHA"
          --digest "$DIGEST" --release "$RELEASE_TAG"
